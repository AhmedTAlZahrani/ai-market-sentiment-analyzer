name: Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy nltk scikit-learn pytest
      - run: python -c "import nltk; nltk.download('vader_lexicon', quiet=True)"
      - run: pytest tests/ -v
